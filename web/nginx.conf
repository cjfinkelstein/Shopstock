server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Streaming chat responses for the AI assistant panel -- nginx buffers
    # proxied responses by default, which would silently swallow the whole
    # point of streaming (the panel would look hung, then dump the full
    # answer at once). Must come before the general /api/ block below since
    # nginx matches the most specific/first applicable prefix.
    location /api/v1/assistant/ {
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API proxied to the FastAPI service. nginx's default body-size cap is
    # 1MB, which would reject any real photo/document upload (they're sent
    # as base64 JSON, so a 200MB PDF becomes a ~270MB request) -- raised well
    # above the biggest file this app is expected to handle.
    location /api/ {
        client_max_body_size 350M;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # hashed build assets can be cached forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # never cache the service worker or manifest
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # nginx's default mime.types has no entry for .webmanifest, so it falls
    # back to application/octet-stream -- Safari silently ignores a
    # manifest served with the wrong type, breaking "Add to Home Screen".
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # never let browsers/iOS cache the HTML shell itself -- it's what
    # references the hashed JS/CSS files, so a stale copy pins you to an
    # old build indefinitely even after we ship a fix.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
