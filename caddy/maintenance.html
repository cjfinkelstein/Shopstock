<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="15">
<title>We'll be right back — APEX Electrical Group</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #eef1ff 0%, #f7f8fc 55%, #ffffff 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    color: #1e2433;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: #ffffff;
    border-radius: 24px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 20px 60px -20px rgba(30, 40, 90, 0.25);
  }
  .brand {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #8891a8;
    margin: 0 0 6px;
  }
  h1 {
    font-size: 22px;
    font-weight: 800;
    margin: 0 0 14px;
    color: #14182a;
  }
  p {
    font-size: 14.5px;
    line-height: 1.55;
    color: #565f78;
    margin: 0 0 24px;
  }
  .spinner {
    width: 44px;
    height: 44px;
    margin: 0 auto 20px;
    border-radius: 50%;
    border: 3px solid #dfe3f5;
    border-top-color: #4338ca;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint {
    font-size: 12px;
    color: #9aa2b8;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="spinner" aria-hidden="true"></div>
    <p class="brand">APEX Electrical Group</p>
    <h1>We're currently updating the system</h1>
    <p>We'll be back with you shortly — this page will refresh automatically, or you can reload whenever you're ready.</p>
    <p class="hint">Usually just a minute or two.</p>
  </div>
</body>
</html>
