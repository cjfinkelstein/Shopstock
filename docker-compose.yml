services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopstock}
      POSTGRES_USER: ${POSTGRES_USER:-shopstock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopstock}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopstock} -d ${POSTGRES_DB:-shopstock}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-shopstock}:${POSTGRES_PASSWORD:-shopstock}@db:5432/${POSTGRES_DB:-shopstock}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      APP_NAME: ${APP_NAME:-APEX Electrical Stock}
      CORS_ORIGINS: ""
      # used by `scripts/seed.py --minimal` at go-live
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shopstock.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme123}
      # outbound email (estimate-sending) -- set these in .env once a
      # company mailbox is chosen; blank host = sending cleanly fails with
      # a clear error instead of pretending to work
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-APEX Electrical Group}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://shop.apexelectricalgroupinc.com}
      # AI features (admin console assistant panel + plan-sheet reading on
      # estimates) -- blank = both cleanly fail with a clear error instead
      # of pretending to work
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  pgdata:
