name: Build and publish images

# Builds the api and web Docker images on GitHub's servers (not the tiny
# production droplet) and pushes them to GitHub Container Registry. The
# droplet then just downloads ("pulls") the finished image instead of
# compiling it locally -- that on-server compile step is what was exhausting
# the droplet's 1GB of RAM and causing outages during every deploy.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/shopstock-api:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/shopstock-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/shopstock-web:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/shopstock-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
